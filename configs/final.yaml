seed: 468

data:
  train_path: data/raw/final/train.jsonl
  validation_path: data/raw/final/validation.jsonl
  max_source_length: 80
  max_target_length: 80
  vocab_min_frequency: 2
  vocab_max_size: 20000

model:
  embedding_dim: 256
  encoder_hidden_dim: 256
  decoder_hidden_dim: 256
  attention_dim: 256
  dropout: 0.3

training:
  batch_size: 32
  epochs: 10
  learning_rate: 0.001
  max_gradient_norm: 1.0
  num_workers: 2
  mixed_precision: true

output:
  directory: checkpoints/final
